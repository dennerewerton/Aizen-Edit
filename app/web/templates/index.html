<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Aizen Auto Editor</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main>
<h1>Aizen Auto Editor <small>MVP local</small></h1><p>Selecione uma gameplay. O arquivo original nunca será alterado.</p>
<section><label>Arquivo de vídeo <input id="path" placeholder="C:\\Vídeos\\gameplay.mp4"></label><div class="settings"><label>Edição <select id="edit"><option value="automatic">Automática</option><option>Mais dinâmica</option><option>Mais natural</option><option>Só melhores momentos</option></select></label><label>Efeitos <select id="effects"><option>Nenhum</option><option>Baixo</option><option selected>Médio</option><option>Alto</option></select></label><label>Legendas <select id="captions"><option>Nenhuma</option><option selected>Apenas momentos importantes</option><option>Todas as falas</option></select></label></div><button id="load">Carregar vídeo</button></section>
<section id="info" hidden></section>
<section id="actions" hidden><button id="analyze">Analisar vídeo</button><button id="edl" disabled>Gerar edição (EDL)</button><button id="preview" disabled>Gerar preview</button><button id="final" disabled>Renderizar final</button><button id="cancel" hidden>Cancelar operação</button></section>
<section id="calibration" hidden><h2>Configurar layout do Free Fire</h2><p>Selecione uma região, desenhe sobre o frame e salve. Os valores normalizados funcionam em qualquer resolução.</p><label>Região a desenhar <select id="region-select"><option value="webcam">Webcam</option><option value="scoreboard">Placar</option><option value="kill_feed">Kill feed</option><option value="hp">HP</option><option value="minimap">Minimapa</option><option value="gameplay_center">Centro da gameplay</option></select></label><canvas id="calibration-canvas" aria-label="Frame para calibração"></canvas><div id="regions"></div><button id="save-layout">Salvar layout</button></section>
<section><h2>Progresso</h2><ol id="log"><li>○ Aguardando vídeo</li></ol></section>
<section id="results" hidden><h2>Melhores momentos</h2><p id="warning"></p><div id="highlights"></div></section>
<section id="player" hidden><h2>Player</h2><video controls></video></section>
</main><script src="/static/app.js"></script></body></html>
